<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Game Night</title>
</head>
<body>
  <h1>Game Night</h1>
  <table>
    <thead><tr><th>Nome</th><th>Giocatori</th><th>Durata</th></tr></thead>
    <tbody id="giochi"></tbody>
  </table>
  <script>
    const tbody = document.getElementById('giochi');

    function riga(...celle) {
      const tr = document.createElement('tr');
      for (const testo of celle) {
        const td = document.createElement('td');
        td.textContent = testo;
        tr.append(td);
      }
      tr.lastChild.colSpan = 4 - celle.length;
      return tr;
    }

    async function caricaGiochi() {
      try {
        const res = await fetch('/api/giochi');
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const giochi = await res.json();
        if (giochi.length === 0) {
          tbody.append(riga('Nessun gioco'));
          return;
        }
        for (const g of giochi) {
          tbody.append(riga(g.nome, `${g.minGiocatori}–${g.maxGiocatori}`, `${g.durataMin} min`));
        }
      } catch (e) {
        tbody.append(riga(`Errore nel caricamento: ${e.message}`));
      }
    }

    caricaGiochi();
  </script>
</body>
</html>
